<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Слаботочка PRO — справочник слаботочных систем</title>
<link rel="manifest" href='data:application/json,{"name":"Слаботочка PRO","short_name":"Слаботочка","display":"standalone","background_color":"%230d1117","theme_color":"%230d1117"}'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Golos+Text:wght@400;500;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1117; --panel:#151b26; --panel2:#1b2330; --line:rgba(150,175,210,.13);
  --txt:#e9eef6; --mut:#93a1b8; --acc:#ffb340; --acc2:#41c7ff;
  --red:#ff5d4d; --grn:#35e0a1;
  --r:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#070a0f;color:var(--txt);font-family:'Golos Text',system-ui,sans-serif;font-size:15px;line-height:1.5;overflow:hidden}
body::before{content:"";position:fixed;inset:0;background-image:
  linear-gradient(rgba(90,130,190,.05) 1px,transparent 1px),
  linear-gradient(90deg,rgba(90,130,190,.05) 1px,transparent 1px);
  background-size:34px 34px;pointer-events:none}
.bgfx{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.5;pointer-events:none}
.bgfx path{fill:none;stroke-width:1.5;stroke-dasharray:4 10;animation:trace 9s linear infinite}
@keyframes trace{to{stroke-dashoffset:-280}}
.wrap{position:relative;z-index:1;height:100dvh;display:flex;align-items:center;justify-content:center}
.phone{position:relative;width:100%;height:100%;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:560px){
  body{overflow:auto}
  .wrap{padding:26px}
  .phone{width:min(430px,100%);height:min(920px,calc(100dvh - 52px));border-radius:34px;border:1px solid #232c3b;
    box-shadow:0 50px 140px rgba(0,0,0,.65),0 0 0 8px #0a0d12,0 0 0 9px #1c2431}
}
/* status bar */
.sbar{height:28px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#c7d3e4}
.sbar svg{display:block}
/* app bar */
.abar{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px 10px;border-bottom:1px solid var(--line)}
.logo{width:38px;height:38px;flex:none;border-radius:11px;background:linear-gradient(140deg,#ff7a3d,#ffb340);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(255,150,50,.35)}
.brand{line-height:1.05}
.brand b{font-family:'Russo One',sans-serif;font-size:16px;letter-spacing:.5px;display:block}
.brand span{font-size:10.5px;color:var(--mut);letter-spacing:.14em;text-transform:uppercase}
.abar .sp{flex:1}
.abtn{width:38px;height:38px;border:none;border-radius:11px;background:var(--panel2);color:#c7d3e4;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:transform .15s, background .2s}
.abtn:active{transform:scale(.92)}
.favcount{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;font-family:'JetBrains Mono',monospace}
/* main */
main{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#2b3547 transparent;position:relative}
main::-webkit-scrollbar{width:3px}main::-webkit-scrollbar-thumb{background:#2b3547}
.screen{display:none;padding:14px 14px 22px;animation:scrin .28s ease both}
.screen.on{display:block}
@keyframes scrin{from{opacity:0;transform:translateY(10px)}}
h2.sec{font-family:'Russo One',sans-serif;font-size:17px;letter-spacing:.4px;margin:18px 2px 10px;display:flex;align-items:center;gap:8px}
h2.sec::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--acc)}
h2.sec small{font-family:'Golos Text';font-weight:400;font-size:11px;color:var(--mut);letter-spacing:0}
/* home */
.hello{background:linear-gradient(150deg,#1b2330,#151b26 60%);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;position:relative;overflow:hidden}
.hello::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(255,179,64,.16),transparent 70%)}
.hello .date{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--acc);letter-spacing:.08em}
.hello h1{font-family:'Russo One',sans-serif;font-size:19px;margin:3px 0 4px}
.hello p{font-size:12.5px;color:var(--mut)}
.searchbar{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:11px 14px;margin-bottom:14px;color:var(--mut);cursor:pointer;font-size:13.5px;transition:border-color .2s}
.searchbar:active{border-color:var(--acc)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 12px;cursor:pointer;overflow:hidden;transition:transform .15s,border-color .2s;animation:rise .45s ease both}
.tile:active{transform:scale(.965)}
.tile::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c);opacity:.9}
.ticon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.tile b{display:block;font-size:13.5px;line-height:1.25;margin-bottom:2px}
.tile span{font-size:10.5px;color:var(--mut);font-family:'JetBrains Mono',monospace}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
/* marquee */
.mq{overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#11161f;margin-bottom:14px;position:relative}
.mq::before,.mq::after{content:"";position:absolute;top:0;bottom:0;width:26px;z-index:2}
.mq::before{left:0;background:linear-gradient(90deg,#11161f,transparent)}
.mq::after{right:0;background:linear-gradient(-90deg,#11161f,transparent)}
.mqtrack{display:flex;gap:22px;width:max-content;padding:9px 0;animation:mq 46s linear infinite;font-size:12px;color:#c7d3e4;white-space:nowrap}
.mqtrack i{font-style:normal;color:var(--acc);font-family:'JetBrains Mono',monospace}
@keyframes mq{to{transform:translateX(-50%)}}
/* quick tools */
.qrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.qrow::-webkit-scrollbar{display:none}
.qchip{flex:none;display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:20px;padding:8px 13px;font-size:12.5px;font-family:'Golos Text';cursor:pointer;transition:transform .15s}
.qchip:active{transform:scale(.94)}
.qchip .d{width:8px;height:8px;border-radius:50%}
/* systems list */
.sysrow{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:9px;cursor:pointer;transition:transform .15s,border-color .2s}
.sysrow:active{transform:scale(.98)}
.sysrow .ticon{margin:0;width:42px;height:42px}
.sysrow .txt{flex:1;min-width:0}
.sysrow b{display:block;font-size:14px}
.sysrow p{font-size:11px;color:var(--mut);font-family:'JetBrains Mono',monospace}
.sysrow .arr{color:var(--mut)}
/* detail */
.hero{border-radius:var(--r);padding:16px 15px;margin-bottom:12px;border:1px solid var(--line);position:relative;overflow:hidden}
.hero .hicon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:9px}
.hero h1{font-family:'Russo One',sans-serif;font-size:19px;line-height:1.2}
.hero p{font-size:12px;opacity:.85;margin-top:3px}
.normchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.nchip{font-size:10.5px;font-family:'JetBrains Mono',monospace;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.14);padding:3px 8px;border-radius:7px}
.backbtn{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--mut);font-family:'Golos Text';font-size:13px;cursor:pointer;margin-bottom:10px;padding:4px 2px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:13px;scrollbar-width:none;position:sticky;top:-14px;background:var(--bg);padding:8px 0;z-index:5}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--panel2);color:var(--mut);font-family:'Golos Text';font-weight:600;font-size:12.5px;border-radius:20px;padding:7px 14px;cursor:pointer;transition:all .2s}
.tab.on{background:var(--c,var(--acc));border-color:transparent;color:#0d1117}
.tpanel{display:none}.tpanel.on{display:block;animation:scrin .25s ease both}
/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-bottom:11px}
.card.flash{animation:flash 1.6s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 2px var(--acc);border-color:var(--acc)}100%{box-shadow:none}}
.chead{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.chead h3{font-size:14.5px;font-weight:800;flex:1;line-height:1.3}
.favbtn{flex:none;width:30px;height:30px;border:none;background:var(--panel2);border-radius:9px;color:#5b6a80;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s,color .2s}
.favbtn.on{color:var(--red)}
.favbtn.pop{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.3)}}
.cbody{font-size:13.5px;color:#cbd5e3}
.cbody p{margin-bottom:8px}
.cbody p:last-child{margin-bottom:0}
.ul{padding-left:18px;margin:4px 0 8px}
.ul li{margin-bottom:5px}
.ul li::marker{color:var(--acc)}
.mono{font-family:'JetBrains Mono',monospace;font-size:.92em}
/* tables */
.tblwrap{overflow-x:auto;margin:6px 0 10px;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:280px}
th{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);text-align:left;padding:7px 9px;background:#11161f}
td{padding:7px 9px;border-top:1px dashed var(--line);vertical-align:top}
tr:hover td{background:rgba(255,255,255,.02)}
/* callouts */
.co{border-radius:10px;padding:9px 11px;font-size:12.5px;margin:8px 0;border-left:3px solid}
.co.norm{background:rgba(65,199,255,.08);border-color:var(--acc2)}
.co.warn{background:rgba(255,179,64,.09);border-color:var(--acc)}
.co.err{background:rgba(255,93,77,.09);border-color:var(--red)}
.co.tip{background:rgba(53,224,161,.08);border-color:var(--grn)}
.co b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:2px}
.co.norm b{color:var(--acc2)}.co.warn b{color:var(--acc)}.co.err b{color:var(--red)}.co.tip b{color:var(--grn)}
.errlist{counter-reset:e;list-style:none;padding:0}
.errlist li{counter-increment:e;position:relative;padding:8px 0 8px 34px;border-top:1px dashed var(--line);font-size:13px}
.errlist li:first-child{border-top:none}
.errlist li::before{content:counter(e);position:absolute;left:0;top:8px;width:24px;height:24px;border-radius:8px;background:rgba(255,93,77,.15);color:var(--red);font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
/* schemes */
.schfilter{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.schfilter::-webkit-scrollbar{display:none}
.scheme{border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.scheme:first-of-type{border-top:none;padding-top:0;margin-top:0}
.schmeta{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.schtag{font-size:10px;font-family:'JetBrains Mono',monospace;padding:3px 8px;border-radius:6px;border:1px solid;font-weight:700}
.svgwrap{background:#0b0f16;border:1px solid var(--line);border-radius:12px;padding:8px;overflow-x:auto}
.svgwrap svg{width:100%;min-width:320px;display:block}
.svgwrap text{font-family:'Golos Text',sans-serif}
.blk{fill:#1a2432;stroke:#33415a;stroke-width:1}
.blkt{fill:#e4ebf5;font-size:8.5px;font-weight:700}
.mut{fill:#8fa0b8;font-size:6.8px}
.lbl{fill:#c7d3e4;font-size:7.2px;font-weight:600}
.wire{fill:none;stroke-width:2;stroke-linecap:round}
.flow{fill:none;stroke:rgba(255,255,255,.85);stroke-width:2;stroke-linecap:round;stroke-dasharray:2 9;animation:fl 1.5s linear infinite}
@keyframes fl{to{stroke-dashoffset:-44}}
.led{animation:blink 1.4s ease infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
.schcap{font-size:11.5px;color:var(--mut);margin-top:7px}
/* calc */
.calc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.calc h3{font-size:14px;font-weight:800;margin-bottom:3px;display:flex;align-items:center;gap:8px}
.calc .sub{font-size:11.5px;color:var(--mut);margin-bottom:11px}
.frow{display:flex;gap:8px;margin-bottom:8px}
.fld{flex:1;min-width:0}
.fld label{display:block;font-size:10.5px;color:var(--mut);margin-bottom:3px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.05em}
.fld input,.fld select{width:100%;background:#10151f;border:1px solid var(--line);border-radius:9px;color:var(--txt);font-family:'JetBrains Mono',monospace;font-size:13.5px;padding:8px 9px;outline:none;transition:border-color .2s}
.fld input:focus,.fld select:focus{border-color:var(--acc)}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
.presets button{background:#10151f;border:1px solid var(--line);color:#aab8cc;font-size:11px;border-radius:14px;padding:5px 10px;font-family:'Golos Text';cursor:pointer}
.presets button:active{border-color:var(--acc);color:var(--txt)}
.res{background:#10151f;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:4px}
.res .big{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:700;color:var(--acc)}
.res .row{display:flex;justify-content:space-between;padding:3px 0;font-size:12px;color:#c0cddd}
.res .row b{font-family:'JetBrains Mono',monospace;color:var(--txt)}
.verdict{margin-top:6px;font-size:12px;font-weight:600;padding:6px 9px;border-radius:8px}
.v-ok{background:rgba(53,224,161,.12);color:var(--grn)}
.v-md{background:rgba(255,179,64,.13);color:var(--acc)}
.v-bad{background:rgba(255,93,77,.13);color:var(--red)}
/* info */
.gloss dt{font-weight:800;color:var(--acc);font-size:13px;margin-top:8px}
.gloss dd{font-size:12.5px;color:#c3cfdc;margin-left:0}
.favitem{display:flex;align-items:center;gap:10px;padding:9px 4px;border-top:1px dashed var(--line);cursor:pointer;font-size:13px}
.favitem:first-child{border-top:none}
.favitem .dot{width:8px;height:8px;border-radius:50%;flex:none}
.favitem .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.favitem .rm{color:var(--mut);border:none;background:none;cursor:pointer;font-size:15px;padding:4px}
.empty{font-size:12.5px;color:var(--mut);padding:8px 2px}
/* search overlay */
.searchov{position:absolute;inset:0;background:rgba(7,10,15,.75);backdrop-filter:blur(3px);z-index:40;display:none;flex-direction:column}
.searchov.on{display:flex;animation:scrin .2s ease}
.spanel{margin:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;max-height:calc(100% - 90px);overflow:hidden;animation:rise .25s ease}
.shead{display:flex;align-items:center;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
.shead input{flex:1;background:#10151f;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--txt);font-family:'Golos Text';font-size:14px;outline:none}
.shead input:focus{border-color:var(--acc)}
.sres{overflow-y:auto;padding:6px}
.sitem{padding:10px 10px;border-radius:10px;cursor:pointer}
.sitem:active{background:#1b2330}
.sitem b{display:block;font-size:13.5px}
.sitem span{font-size:11.5px;color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitem .tag{font-size:9.5px;font-family:'JetBrains Mono',monospace;color:var(--acc);text-transform:uppercase;letter-spacing:.08em}
.sitem mark{background:none;color:var(--acc);font-weight:800}
/* bottom nav */
.bnav{flex:none;display:flex;border-top:1px solid var(--line);background:#10151f;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nbtn{flex:1;border:none;background:none;color:#69788f;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:'Golos Text';font-size:9.5px;font-weight:600;cursor:pointer;padding:6px 0;border-radius:12px;position:relative;transition:color .2s}
.nbtn .nb-ic{width:38px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;transition:background .25s,transform .2s}
.nbtn.on{color:var(--acc)}
.nbtn.on .nb-ic{background:rgba(255,179,64,.14);transform:translateY(-1px)}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.25);transform:scale(0);animation:rip .5s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(3);opacity:0}}
.toast{position:absolute;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);background:#1b2330;border:1px solid var(--line);color:var(--txt);font-size:12.5px;padding:9px 16px;border-radius:22px;opacity:0;pointer-events:none;transition:all .3s;z-index:60;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.rv{opacity:0}
.rv.in{animation:rise .5s ease forwards}
footer.appfoot{text-align:center;font-size:10.5px;color:#5b6a80;padding:18px 10px 6px;font-family:'JetBrains Mono',monospace}
</style>
</head>
<body>
<svg class="bgfx" viewBox="0 0 800 900" preserveAspectRatio="xMidYMid slice">
  <path d="M-20 120 H240 L290 170 H820" stroke="rgba(255,179,64,.35)"/>
  <path d="M-20 700 H180 L240 640 H500 L560 700 H830" stroke="rgba(65,199,255,.3)"/>
  <path d="M620 -20 V220 L680 280 V920" stroke="rgba(192,139,250,.28)"/>
</svg>

<div class="wrap">
<div class="phone" id="phone">

  <div class="sbar">
    <span id="clock">--:--</span>
    <span style="display:flex;gap:6px;align-items:center">
      <svg width="15" height="11" viewBox="0 0 15 11"><rect x="0" y="7" width="2.5" height="4" fill="#c7d3e4"/><rect x="4" y="5" width="2.5" height="6" fill="#c7d3e4"/><rect x="8" y="3" width="2.5" height="8" fill="#c7d3e4"/><rect x="12" y="1" width="2.5" height="10" fill="#5b6a80"/></svg>
      <svg width="15" height="11" viewBox="0 0 16 12"><path d="M8 11 L1 4.5 A10 10 0 0 1 15 4.5 Z" fill="#c7d3e4"/></svg>
      <svg width="22" height="11" viewBox="0 0 22 11"><rect x=".5" y=".5" width="18" height="10" rx="2.5" fill="none" stroke="#c7d3e4"/><rect x="2.5" y="2.5" width="12" height="6" rx="1" fill="#35e0a1"/><rect x="19.5" y="3.5" width="2" height="4" rx="1" fill="#c7d3e4"/></svg>
    </span>
  </div>

  <header class="abar">
    <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#12100a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 5 13h6l-1 9 9-12h-6l1-8z" fill="#12100a"/></svg></div>
    <div class="brand"><b>СЛАБОТОЧКА&nbsp;PRO</b><span>справочник СС · офлайн</span></div>
    <div class="sp"></div>
    <button class="abtn rp" id="btnSearch" aria-label="Поиск"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></button>
    <button class="abtn rp" id="btnFavTop" aria-label="Избранное"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21C7 16.5 3 13.3 3 9.3 3 6.4 5.2 4 8 4c1.6 0 3.1.8 4 2 .9-1.2 2.4-2 4-2 2.8 0 5 2.4 5 5.3 0 4-4 7.2-9 11.7z"/></svg><span class="favcount" id="favcount" style="display:none">0</span></button>
  </header>

{id:'du',name:'Дымоудаление',tag:'ДУ и подпор',color:'#35e0a1',icon:'wind',norms:['СП 7.13130.2013','СП 6.13130.2021'],tabs:[

 ]},
 {id:'mount',label:'Монтаж',cards:[

const rho=0.0175;
function calcVD(){const L=+$('#vdL').value||0,I=(+$('#vdI').value||0)/1000,S=+$('#vdS').value,U=+$('#vdU').value;
 const dU=rho*2*L*I/S,rem=U-dU,p=dU/U*100;
 let v=p<=5?['v-ok','Отлично: укладывается в 5 %']:p<=10?['v-md','Внимание: на границе — проверьте паспорт устройства']:['v-bad','Много: увеличивайте сечение или сокращайте линию'];
 $('#vdRes').innerHTML=`<div class="big">ΔU = ${dU.toFixed(2)} В</div><div class="row"><span>на устройстве</span><b>${rem.toFixed(2)} В из ${U} В</b></div><div class="row"><span>в процентах</span><b>${p.toFixed(1)} %</b></div><div class="verdict ${v[0]}">${v[1]}</div>`;}
function calcHD(){const N=+$('#hdN').value||0,B=+$('#hdB').value||0,D=+$('#hdD').value||0;
 const gb=N*B*3600*24*D/8/1024,tb=gb/1024;
 const opt=[4,6,8,10,12,16,20];const rec=opt.find(x=>x>=tb)||Math.ceil(tb);
 $('#hdRes').innerHTML=`<div class="big">${tb>=1?tb.toFixed(2)+' ТБ':Math.round(gb)+' ГБ'}</div><div class="row"><span>суммарный поток</span><b>${(N*B).toFixed(1)} Мбит/с</b></div><div class="verdict v-ok">Ближайший подходящий накопитель — ${rec} ТБ (surveillance-серия)</div>`;}
function calcAKB(){const P=+$('#akP').value||0,t=+$('#akT').value||0,U=+$('#akU').value;
 const C=P*t/(U*0.8)*1.25;const std=[7,12,17,26,40,65,100];const rec=std.find(x=>x>=C)||Math.ceil(C/100)*100;
 $('#akRes').innerHTML=`<div class="big">≈ ${Math.ceil(C)} А·ч</div><div class="row"><span>энергия за время автономии</span><b>${(P*t).toFixed(0)} Вт·ч</b></div><div class="verdict v-ok">Ближайший стандартный АКБ — ${rec} А·ч</div>`;}
function calcDET(){const L=+$('#deL').value||0,Wd=+$('#deW').value||0,a=+$('#deT').value;
 const nx=Math.max(1,Math.ceil(L/a)),ny=Math.max(1,Math.ceil(Wd/a)),n=nx*ny;
 $('#deRes').innerHTML=`<div class="big">${n} шт</div><div class="row"><span>сетка</span><b>${nx} × ${ny} (шаг до ${a} м)</b></div><div class="row"><span>при алгоритме В (×2 датчика)</span><b>${n*2} шт</b></div><div class="verdict v-md">От стен — не более ${a/2} м; финальная раскладка — по плану с учётом балок и вентиляции</div>`;}
function calcRS(){const L=+$('#rsL').value||0,S=+$('#rsS').value;
 const R=rho*2*L/S;
 let v=R<30?['v-ok','Низкое сопротивление — ок для большинства приборов']:R<60?['v-md','Приемлемо, но сверьте лимит в паспорте ПКП']:['v-bad','Высокое: берите большее сечение или укорачивайте линию'];
 $('#rsRes').innerHTML=`<div class="big">${R.toFixed(1)} Ом</div><div class="row"><span>одна жила</span><b>${(R/2).toFixed(1)} Ом</b></div><div class="verdict ${v[0]}">${v[1]}</div>`;}

 <div class="card" data-fid="info:norms" data-ctitle="Нормативные документы"><div class="chead"><h3>Основные документы</h3><button class="favbtn rp" data-fid="info:norms">${HEART}</button></div><div class="cbody">${T(['Документ','О чём'],NORMS)}${W('Перед проектированием проверяйте актуальную редакцию и изменения — документы обновляются.')}</div></div>
 <h2 class="sec">Глоссарий</h2>
 <div class="card" data-fid="info:gloss" data-ctitle="Глоссарий слаботочника"><div class="chead"><h3>Термины</h3><button class="favbtn rp" data-fid="info:gloss">${HEART}</button></div><div class="cbody"><dl class="gloss">${GLOSS.map(g=>`<dt>${g[0]}</dt><dd>${g[1]}</dd>`).join('')}</dl></div></div>
 <h2 class="sec">О приложении</h2>
 <div class="card" data-fid="info:about" data-ctitle="О приложении"><div class="cbody">
 <p>«Слаботочка PRO» — офлайн-справочник для проектировщиков и монтажников слаботочных систем. Работает без сети, все разделы, схемы и калькуляторы внутри одного файла.</p>
 ${P('Числовые значения приведены по действующим редакциям СП/ГОСТ для быстрой ориентировки. В проекте всегда сверяйтесь с актуальной редакцией документа и паспортами оборудования.')}
 </div></div>`;
 renderFavViews();refreshFavBtns($('#scr-info'));
}
function renderFavViews(){
 const list=[...FAVS].map(f=>FAVMETA[f]).filter(Boolean);
 const html=list.length?list.map(m=>`<div class="favitem" data-goto="${m.fid}"><span class="dot" style="background:${m.color}"></span><span class="t">${m.title}</span><button class="rm" data-rm="${m.fid}">✕</button></div>`).join(''):`<div class="empty">${$('#homefavs')?'Отмечайте карточки сердечком — они соберутся здесь. Пока пусто.':'Пусто.'}</div>`;
 const h=$('#homefavs'),i=$('#infofavs');
 if(h)h.innerHTML=html; if(i)i.innerHTML=html;
 $$('.favitem').forEach(el=>el.onclick=e=>{if(e.target.dataset.rm){toggleFav(e.target.dataset.rm);return;}gotoFav(el.dataset.goto);});
 const fc=$('#favcount');fc.textContent=list.length;fc.style.display=list.length?'flex':'none';
}

/* ============ ИНДЕКС ПОИСКА ============ */
function buildIndex(){
 INDEX.length=0;
 SYSTEMS.forEach(s=>s.tabs.forEach(t=>{
   const d=document.createElement('div');d.innerHTML=t.cards.map((c,j)=>card(`${s.id}:${t.id}:${j}`,c[0],c[1])).join('');
   d.querySelectorAll('.card').forEach(c=>{
     const fid=c.dataset.fid,title=c.dataset.ctitle,text=c.innerText.replace(/\s+/g,' ');
     INDEX.push({fid,title,text,type:'sys',sys:s.id,tab:t.id,tag:`${s.tag} · ${t.label}`,color:s.color});
     FAVMETA[fid]={fid,title,tag:s.tag,color:s.color};
   });
 }));
 SCHEMES.forEach(sc=>{const s=sysById(sc.sys);const d=document.createElement('div');d.innerHTML=sc.svg;
   const text=(sc.title+' '+sc.cap+' '+d.textContent).replace(/\s+/g,' ');
   INDEX.push({fid:sc.id,title:sc.title,text,type:'scheme',tag:s.tag+' · схема',color:s.color});
   FAVMETA[sc.id]={fid:sc.id,title:sc.title,tag:'Схема',color:s.color};});
 [['info:cables','Кабели слаботочных систем'],['info:resist','Сопротивление медных жил'],['info:norms','Нормативные документы'],['info:gloss','Глоссарий слаботочника'],['info:about','О приложении']].forEach(([fid,t])=>{FAVMETA[fid]={fid,title:t,tag:'Справочное',color:'#6f8bff'};});
 [['info:cables',CABLES.map(c=>c.join(' ')).join(' '),'Кабели слаботочных систем'],
  ['info:resist',RESIST.map(r=>r.join(' ')).join(' '),'Сопротивление медных жил'],
  ['info:norms',NORMS.map(n=>n.join(' ')).join(' '),'Нормативные документы'],
  ['info:gloss',GLOSS.map(g=>g.join(' — ')).join(' '),'Глоссарий слаботочника']].forEach(([fid,text,title])=>INDEX.push({fid,title,text,type:'info',tag:'Справочное',color:'#6f8bff'}));
}
function openSearch(){$('#searchov').classList.add('on');setTimeout(()=>$('#sinput').focus(),80);}
function closeSearch(){$('#searchov').classList.remove('on');$('#sinput').value='';$('#sres').innerHTML='<div class="empty" style="padding:14px">Введите запрос — ищем по всем разделам, схемам и нормам.</div>';}
function runSearch(q){
 q=q.trim().toLowerCase();const box=$('#sres');
 if(q.length<2){box.innerHTML='<div class="empty" style="padding:14px">Минимум 2 символа.</div>';return;}
 const res=INDEX.filter(it=>(it.title+' '+it.text).toLowerCase().includes(q)).slice(0,30);
 if(!res.length){box.innerHTML='<div class="empty" style="padding:14px">Ничего не найдено. Попробуйте: «датчик», «FRLS», «PoE», «СП 484».</div>';return;}
 box.innerHTML=res.map((r,i)=>{
   const idx=r.text.toLowerCase().indexOf(q);
   const snip=idx>=0?'…'+r.text.slice(Math.max(0,idx-40),idx+q.length+70).replace(new RegExp(q,'gi'),m=>`<mark>${m}</mark>`)+'…':r.text.slice(0,90)+'…';
   return `<div class="sitem rp" data-i="${i}"><span class="tag" style="color:${r.color}">${r.tag}</span><b>${r.title}</b><span>${snip}</span></div>`;
 }).join('');
 box.querySelectorAll('.sitem').forEach(el=>el.onclick=()=>{const r=res[+el.dataset.i];closeSearch();gotoFav(r.fid,r);});
}
function gotoFav(fid,meta){
 const m=FAVMETA[fid]||meta||{};
 if(fid.startsWith('sch-')){showScreen('schemes');setTimeout(()=>focus(fid),80);return;}
 if(fid.startsWith('info:')){showScreen('info');setTimeout(()=>focus(fid),80);return;}
 const [sys,tab]=fid.split(':');
 showDetail(sys);showScreen('detail');
 setTimeout(()=>{
   const btn=$(`#scr-detail .tab[data-tab="${tab}"]`);if(btn)btn.click();
   setTimeout(()=>focus(fid),60);
 },80);
}
function focus(fid){const el=document.querySelector(`[data-fid="${fid}"]`);if(!el)return;el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');}

/* ============ НАВИГАЦИЯ ============ */
function showScreen(name){
 $$('.screen').forEach(s=>s.classList.remove('on'));
 $('#scr-'+name).classList.add('on');
 $$('.nbtn').forEach(b=>b.classList.toggle('on',b.dataset.scr===name||(name==='detail'&&b.dataset.scr==='systems')));
 $('#main').scrollTop=0;reveal();
}
function showDetail(id){renderDetail(id);showScreen('detail');}
function goCalc(cid){showScreen('calc');setTimeout(()=>{const el=$('#c-'+cid);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},80);}

/* ============ ИЗБРАННОЕ ============ */
function toggleFav(fid){
 if(FAVS.has(fid)){FAVS.delete(fid);toast('Удалено из избранного');}else{FAVS.add(fid);toast('Добавлено в избранное ♥');}
 try{localStorage.setItem('slava_favs',JSON.stringify([...FAVS]))}catch(e){}
 refreshFavBtns(document);renderFavViews();
}
function refreshFavBtns(root){
 root.querySelectorAll('.favbtn').forEach(b=>{b.classList.toggle('on',FAVS.has(b.dataset.fid));});
}
document.addEventListener('click',e=>{
 const b=e.target.closest('.favbtn');if(b){b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');toggleFav(b.dataset.fid);}
});

/* ============ ЭФФЕКТЫ ============ */
document.addEventListener('pointerdown',e=>{
 const el=e.target.closest('.rp');if(!el)return;
 const r=document.createElement('span');r.className='ripple';
 const rect=el.getBoundingClientRect(),d=Math.max(rect.width,rect.height);
 r.style.width=r.style.height=d+'px';r.style.left=(e.clientX-rect.left-d/2)+'px';r.style.top=(e.clientY-rect.top-d/2)+'px';
 el.style.position=el.style.position||'relative';el.style.overflow='hidden';
 el.appendChild(r);setTimeout(()=>r.remove(),520);
});
let obs;
function reveal(){
 if(obs)obs.disconnect();
 obs=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');obs.unobserve(x.target);}}),{threshold:.06});
 $$('.rv:not(.in)').forEach(el=>obs.observe(el));
}
function tickClock(){const d=new Date();$('#clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
$('#btnSearch').onclick=openSearch;
$('#btnSrchClose').onclick=closeSearch;
$('#searchov').addEventListener('click',e=>{if(e.target.id==='searchov')closeSearch();});
$('#sinput').addEventListener('input',e=>runSearch(e.target.value));
$('#btnFavTop').onclick=()=>{showScreen('info');setTimeout(()=>$('#infofavs')&&$('#infofavs').scrollIntoView({behavior:'smooth'}),80);};
$$('#bnav .nbtn').forEach(b=>b.onclick=()=>showScreen(b.dataset.scr));

/* ============ СТАРТ ============ */
renderHome();renderSystems();renderSchemes();renderCalc();renderInfo();buildIndex();
refreshFavBtns(document);reveal();tickClock();setInterval(tickClock,10000);
</script>
</body>
</html>
