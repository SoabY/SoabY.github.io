<!DOCTYPE html>
<html lang="ru">
<head>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#0d1117">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Слаботочка PRO — справочник слаботочных систем</title>
<script>
/* отдельный перехватчик ошибок — работает, даже если основной скрипт не запустился */
window.onerror=function(msg,src,line,col){
  var d=document.getElementById('errbox');
  if(d){d.style.display='block';d.innerHTML='<b>Ошибка запуска:</b> '+msg+'<br>строка '+line+', столбец '+col+'. Сообщите разработчику.';}
  return false;
};
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Golos+Text:wght@400;500;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--panel:#151b26;--panel2:#1b2330;--line:rgba(150,175,210,.13);--txt:#e9eef6;--mut:#93a1b8;--acc:#ffb340;--acc2:#41c7ff;--red:#ff5d4d;--grn:#35e0a1;--r:14px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#070a0f;color:var(--txt);font-family:'Golos Text',system-ui,sans-serif;font-size:15px;line-height:1.5;overflow:hidden}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(90,130,190,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(90,130,190,.05) 1px,transparent 1px);background-size:34px 34px;pointer-events:none}
.wrap{position:relative;z-index:1;height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center}
.phone{position:relative;width:100%;height:100vh;height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:560px){
 .wrap{padding:26px}
 .phone{width:min(430px,100%);height:min(920px,calc(100dvh - 52px));border-radius:34px;border:1px solid #232c3b;box-shadow:0 50px 140px rgba(0,0,0,.65),0 0 0 8px #0a0d12,0 0 0 9px #1c2431}
}
.sbar{height:28px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#c7d3e4}
.abar{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px 10px;border-bottom:1px solid var(--line)}
.logo{width:38px;height:38px;flex:none;border-radius:11px;background:linear-gradient(140deg,#ff7a3d,#ffb340);display:flex;align-items:center;justify-content:center}
.brand{line-height:1.05}
.brand b{font-family:'Russo One',sans-serif;font-size:16px;letter-spacing:.5px;display:block}
.brand span{font-size:10.5px;color:var(--mut);letter-spacing:.14em;text-transform:uppercase}
.abar .sp{flex:1}
.abtn{width:38px;height:38px;border:none;border-radius:11px;background:var(--panel2);color:#c7d3e4;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.abtn:active{transform:scale(.92)}
.favcount{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;font-family:'JetBrains Mono',monospace}
main{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
.screen{display:none;padding:14px 14px 22px;animation:scrin .28s ease both}
.screen.on{display:block}
@keyframes scrin{from{opacity:0;transform:translateY(10px)}}
h2.sec{font-family:'Russo One',sans-serif;font-size:17px;letter-spacing:.4px;margin:18px 2px 10px;display:flex;align-items:center;gap:8px}
h2.sec::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--acc)}
h2.sec small{font-family:'Golos Text';font-weight:400;font-size:11px;color:var(--mut)}
.hello{background:linear-gradient(150deg,#1b2330,#151b26 60%);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.hello .date{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--acc);letter-spacing:.08em}
.hello h1{font-family:'Russo One',sans-serif;font-size:19px;margin:3px 0 4px}
.hello p{font-size:12.5px;color:var(--mut)}
.searchbar{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:11px 14px;margin-bottom:14px;color:var(--mut);cursor:pointer;font-size:13.5px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 12px;cursor:pointer;overflow:hidden;animation:rise .45s ease both}
.tile:active{transform:scale(.965)}
.tile::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c)}
.ticon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.tile b{display:block;font-size:13.5px;line-height:1.25;margin-bottom:2px}
.tile span{font-size:10.5px;color:var(--mut);font-family:'JetBrains Mono',monospace}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.mq{overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#11161f;margin-bottom:14px}
.mqtrack{display:flex;gap:22px;width:max-content;padding:9px 12px;animation:mq 46s linear infinite;font-size:12px;color:#c7d3e4;white-space:nowrap}
.mqtrack i{font-style:normal;color:var(--acc);font-family:'JetBrains Mono',monospace}
@keyframes mq{to{transform:translateX(-50%)}}
.qrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.qrow::-webkit-scrollbar{display:none}
.qchip{flex:none;display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:20px;padding:8px 13px;font-size:12.5px;font-family:'Golos Text',sans-serif;cursor:pointer}
.qchip:active{transform:scale(.94)}
.qchip .d{width:8px;height:8px;border-radius:50%}
.sysrow{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:9px;cursor:pointer}
.sysrow .txt{flex:1;min-width:0}
.sysrow b{display:block;font-size:14px}
.sysrow p{font-size:11px;color:var(--mut);font-family:'JetBrains Mono',monospace}
.hero{border-radius:var(--r);padding:16px 15px;margin-bottom:12px;border:1px solid var(--line)}
.hero h1{font-family:'Russo One',sans-serif;font-size:19px;line-height:1.2;margin-top:9px}
.hero p{font-size:12px;opacity:.85;margin-top:3px}
.normchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.nchip{font-size:10.5px;font-family:'JetBrains Mono',monospace;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.14);padding:3px 8px;border-radius:7px}
.backbtn{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--mut);font-family:'Golos Text',sans-serif;font-size:13px;cursor:pointer;margin-bottom:10px;padding:4px 2px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:13px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--panel2);color:var(--mut);font-family:'Golos Text',sans-serif;font-weight:600;font-size:12.5px;border-radius:20px;padding:7px 14px;cursor:pointer}
.tab.on{background:var(--c,var(--acc));border-color:transparent;color:#0d1117}
.tpanel{display:none}.tpanel.on{display:block;animation:scrin .25s ease both}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-bottom:11px}
.card.flash{animation:flash 1.6s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 2px var(--acc);border-color:var(--acc)}100%{box-shadow:none}}
.chead{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.chead h3{font-size:14.5px;font-weight:800;flex:1;line-height:1.3}
.favbtn{flex:none;width:30px;height:30px;border:none;background:var(--panel2);border-radius:9px;color:#5b6a80;display:flex;align-items:center;justify-content:center;cursor:pointer}
.favbtn.on{color:var(--red)}
.cbody{font-size:13.5px;color:#cbd5e3}
.cbody p{margin-bottom:8px}
.cbody p:last-child{margin-bottom:0}
.ul{padding-left:18px;margin:4px 0 8px}
.ul li{margin-bottom:5px}
.ul li::marker{color:var(--acc)}
.mono{font-family:'JetBrains Mono',monospace;font-size:.92em}
.tblwrap{overflow-x:auto;margin:6px 0 10px;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:280px}
th{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);text-align:left;padding:7px 9px;background:#11161f}
td{padding:7px 9px;border-top:1px dashed var(--line);vertical-align:top}
.co{border-radius:10px;padding:9px 11px;font-size:12.5px;margin:8px 0;border-left:3px solid}
.co.norm{background:rgba(65,199,255,.08);border-color:var(--acc2)}
.co.warn{background:rgba(255,179,64,.09);border-color:var(--acc)}
.co.tip{background:rgba(53,224,161,.08);border-color:var(--grn)}
.co b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:2px}
.co.norm b{color:var(--acc2)}.co.warn b{color:var(--acc)}.co.tip b{color:var(--grn)}
.errlist{counter-reset:e;list-style:none;padding:0}
.errlist li{counter-increment:e;position:relative;padding:8px 0 8px 34px;border-top:1px dashed var(--line);font-size:13px}
.errlist li:first-child{border-top:none}
.errlist li::before{content:counter(e);position:absolute;left:0;top:8px;width:24px;height:24px;border-radius:8px;background:rgba(255,93,77,.15);color:var(--red);font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.scheme{border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.scheme:first-of-type{border-top:none;padding-top:0;margin-top:0}
.schmeta{margin-bottom:4px}
.schtag{font-size:10px;font-family:'JetBrains Mono',monospace;padding:3px 8px;border-radius:6px;border:1px solid;font-weight:700}
.svgwrap{background:#0b0f16;border:1px solid var(--line);border-radius:12px;padding:8px;overflow-x:auto}
.svgwrap svg{width:100%;min-width:320px;display:block}
.svgwrap text{font-family:'Golos Text',sans-serif}
.blk{fill:#1a2432;stroke:#33415a;stroke-width:1}
.blkt{fill:#e4ebf5;font-size:8.5px;font-weight:700}
.mut{fill:#8fa0b8;font-size:6.8px}
.lbl{fill:#c7d3e4;font-size:7.2px;font-weight:600}
.wire{fill:none;stroke-width:2;stroke-linecap:round}
.flow{fill:none;stroke:rgba(255,255,255,.85);stroke-width:2;stroke-linecap:round;stroke-dasharray:2 9;animation:fl 1.5s linear infinite}
@keyframes fl{to{stroke-dashoffset:-44}}
.led{animation:blink 1.4s ease infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
.schcap{font-size:11.5px;color:var(--mut);margin-top:7px}
.schfilter{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.schfilter::-webkit-scrollbar{display:none}
.calc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.calc h3{font-size:14px;font-weight:800;margin-bottom:3px}
.calc .sub{font-size:11.5px;color:var(--mut);margin-bottom:11px}
.frow{display:flex;gap:8px;margin-bottom:8px}
.fld{flex:1;min-width:0}
.fld label{display:block;font-size:10.5px;color:var(--mut);margin-bottom:3px;font-family:'JetBrains Mono',monospace;text-transform:uppercase}
.fld input,.fld select{width:100%;background:#10151f;border:1px solid var(--line);border-radius:9px;color:var(--txt);font-family:'JetBrains Mono',monospace;font-size:13.5px;padding:8px 9px;outline:none}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
.presets button{background:#10151f;border:1px solid var(--line);color:#aab8cc;font-size:11px;border-radius:14px;padding:5px 10px;font-family:'Golos Text',sans-serif;cursor:pointer}
.res{background:#10151f;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:4px}
.res .big{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:700;color:var(--acc)}
.res .row{display:flex;justify-content:space-between;padding:3px 0;font-size:12px;color:#c0cddd}
.res .row b{font-family:'JetBrains Mono',monospace;color:var(--txt)}
.verdict{margin-top:6px;font-size:12px;font-weight:600;padding:6px 9px;border-radius:8px}
.v-ok{background:rgba(53,224,161,.12);color:var(--grn)}
.v-md{background:rgba(255,179,64,.13);color:var(--acc)}
.v-bad{background:rgba(255,93,77,.13);color:var(--red)}
.gloss dt{font-weight:800;color:var(--acc);font-size:13px;margin-top:8px}
.gloss dd{font-size:12.5px;color:#c3cfdc;margin-left:0}
.favitem{display:flex;align-items:center;gap:10px;padding:9px 4px;border-top:1px dashed var(--line);cursor:pointer;font-size:13px}
.favitem:first-child{border-top:none}
.favitem .dot{width:8px;height:8px;border-radius:50%;flex:none}
.favitem .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.favitem .rm{color:var(--mut);border:none;background:none;cursor:pointer;font-size:15px;padding:4px}
.empty{font-size:12.5px;color:var(--mut);padding:8px 2px}
.searchov{position:absolute;inset:0;background:rgba(7,10,15,.78);z-index:40;display:none;flex-direction:column}
.searchov.on{display:flex;animation:scrin .2s ease}
.spanel{margin:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;max-height:calc(100% - 90px);overflow:hidden}
.shead{display:flex;align-items:center;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
.shead input{flex:1;background:#10151f;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--txt);font-family:'Golos Text',sans-serif;font-size:14px;outline:none}
.sres{overflow-y:auto;padding:6px}
.sitem{padding:10px;border-radius:10px;cursor:pointer}
.sitem:active{background:#1b2330}
.sitem b{display:block;font-size:13.5px}
.sitem span{font-size:11.5px;color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitem .tag{font-size:9.5px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.08em}
.sitem mark{background:none;color:var(--acc);font-weight:800}
.bnav{flex:none;display:flex;border-top:1px solid var(--line);background:#10151f;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nbtn{flex:1;border:none;background:none;color:#69788f;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:'Golos Text',sans-serif;font-size:9.5px;font-weight:600;cursor:pointer;padding:6px 0;border-radius:12px;position:relative;overflow:hidden}
.nbtn .nb-ic{width:38px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center}
.nbtn.on{color:var(--acc)}
.nbtn.on .nb-ic{background:rgba(255,179,64,.14)}
.toast{position:absolute;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);background:#1b2330;border:1px solid var(--line);color:var(--txt);font-size:12.5px;padding:9px 16px;border-radius:22px;opacity:0;pointer-events:none;transition:all .3s;z-index:60;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.appfoot{text-align:center;font-size:10.5px;color:#5b6a80;padding:18px 10px 6px;font-family:'JetBrains Mono',monospace}
#errbox{display:none;position:fixed;left:10px;right:10px;bottom:10px;z-index:999;background:#3a1414;border:1px solid #ff5d4d;color:#ffd9d4;font-family:'JetBrains Mono',monospace;font-size:12px;padding:12px;border-radius:12px}
#bootmsg{padding:34px 22px;color:#93a1b8;font-size:13px;text-align:center}
noscript div{padding:30px;text-align:center;color:#ffd9d4}
</style>
</head>
<body>
<div id="errbox"></div>
<noscript><div>Для работы справочника нужен JavaScript. Откройте файл в браузере (Chrome) или разрешите скрипты.</div></noscript>
<div class="wrap">
<div class="phone">
  <div class="sbar"><span id="clock">--:--</span><span>СЛАБОТОЧКА PRO</span></div>
  <header class="abar">
    <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#12100a" stroke-width="2" stroke-linejoin="round"><path d="M13 2 5 13h6l-1 9 9-12h-6l1-8z" fill="#12100a"/></svg></div>
    <div class="brand"><b>СЛАБОТОЧКА&nbsp;PRO</b><span>справочник · офлайн</span></div>
    <div class="sp"></div>
    <button class="abtn" data-act="search" aria-label="Поиск"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></button>
    <button class="abtn" data-act="favs" aria-label="Избранное"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21C7 16.5 3 13.3 3 9.3 3 6.4 5.2 4 8 4c1.6 0 3.1.8 4 2 .9-1.2 2.4-2 4-2 2.8 0 5 2.4 5 5.3 0 4-4 7.2-9 11.7z"/></svg><span class="favcount" id="favcount" style="display:none">0</span></button>
  </header>
  <main id="main">
    <div id="bootmsg">Загрузка справочника…<br><small>если это сообщение висит дольше 10 секунд — смотрите плашку ошибки внизу экрана</small></div>
    <section class="screen on" id="scr-home"></section>
    <section class="screen" id="scr-systems"></section>
    <section class="screen" id="scr-detail"></section>
    <section class="screen" id="scr-schemes"></section>
    <section class="screen" id="scr-calc"></section>
    <section class="screen" id="scr-info"></section>
  </main>
  <div class="searchov" id="searchov">
    <div class="spanel">
      <div class="shead">
        <input id="sinput" type="text" placeholder="Поиск: датчик, кабель, СП 484, Wiegand…" autocomplete="off">
        <button class="abtn" data-act="search-close"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="sres" id="sres"><div class="empty" style="padding:14px">Введите запрос — поиск по всем разделам, схемам и нормам.</div></div>
    </div>
  </div>
  <nav class="bnav">
    <button class="nbtn on" data-scr="home"><span class="nb-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M3 11 12 3l9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></span>Главная</button>
    <button class="nbtn" data-scr="systems"><span class="nb-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg></span>Системы</button>
    <button class="nbtn" data-scr="schemes"><span class="nb-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h6M4 12h10M4 17h6M14 7h6M18 12h2M14 17h6"/><circle cx="12" cy="7" r="1.6"/><circle cx="16" cy="12" r="1.6"/><circle cx="12" cy="17" r="1.6"/></svg></span>Схемы</button>
    <button class="nbtn" data-scr="calc"><span class="nb-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M8.5 7h7M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01M8.5 15h.01M12 15h.01M15.5 15h.01" stroke-linecap="round"/></svg></span>Расчёт</button>
    <button class="nbtn" data-scr="info"><span class="nb-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5z"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/></svg></span>Инфо</button>

  html+='<div class="sysrow" data-go-sys="'+s.id+'"><div class="ticon" style="color:'+s.color+';background:'+hexA(s.color,.14)+';border:1px solid '+hexA(s.color,.3)+'">'+IC[s.icon]+'</div><div class="txt"><b>'+s.name+'</b><p>'+s.tag+' · '+s.norms[0]+'</p></div><span class="arr"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 5 7 7-7 7"/></svg></span></div>';

 html+='<div class="tabs" style="--c:'+s.color+'">';

 });

function renderCalc(){
 $('#scr-calc').innerHTML='<h2 class="sec">Калькуляторы <small>· считаются на лету</small></h2>'
 +'<div class="calc" id="c-vd"><h3>⚡ Падение напряжения в линии DC</h3><div class="sub">ΔU = ρ · 2L · I / S, ρ(Cu) = 0,0175 Ом·мм²/м</div><div class="frow"><div class="fld"><label>Длина L (в одну сторону), м</label><input type="number" id="vdL" value="50"></div><div class="fld"><label>Ток, мА</label><input type="number" id="vdI" value="120"></div></div><div class="frow"><div class="fld"><label>Сечение, мм²</label><select id="vdS"><option>0.5</option><option selected>0.75</option><option>1</option><option>1.5</option><option>2.5</option></select></div><div class="fld"><label>Напряжение</label><select id="vdU"><option value="12" selected>12 В</option><option value="24">24 В</option></select></div></div><div class="res" id="vdRes"></div></div>'
 +'<div class="calc" id="c-hdd"><h3>💾 Объём архива видеонаблюдения</h3><div class="sub">N камер × битрейт × время записи</div><div class="presets" id="hdP"><button data-b="5">2 Мп · H.265 · 5 Мбит/с</button><button data-b="8">2 Мп · H.264 · 8 Мбит/с</button><button data-b="12">8 Мп · H.265 · 12 Мбит/с</button></div><div class="frow"><div class="fld"><label>Камер, шт</label><input type="number" id="hdN" value="8"></div><div class="fld"><label>Битрейт, Мбит/с</label><input type="number" id="hdB" value="5" step="0.5"></div><div class="fld"><label>Глубина, сут</label><input type="number" id="hdD" value="14"></div></div><div class="res" id="hdRes"></div></div>'
 +'<div class="calc" id="c-akb"><h3>🔋 Ёмкость АКБ для ИБП/РИП</h3><div class="sub">η разряда ≈ 0,8 · запас 25 %</div><div class="frow"><div class="fld"><label>Нагрузка, Вт</label><input type="number" id="akP" value="60"></div><div class="fld"><label>Автономия, ч</label><input type="number" id="akT" value="4" step="0.5"></div><div class="fld"><label>Напряжение</label><select id="akU"><option value="12" selected>12 В</option><option value="24">24 В</option></select></div></div><div class="res" id="akRes"></div></div>'
 +'<div class="calc" id="c-det"><h3>🔥 Число точечных извещателей</h3><div class="sub">Оценка по максимальному расстоянию между датчиками</div><div class="frow"><div class="fld"><label>Длина, м</label><input type="number" id="deL" value="18"></div><div class="fld"><label>Ширина, м</label><input type="number" id="deW" value="12"></div></div><div class="fld" style="margin-bottom:8px"><label>Тип и высота</label><select id="deT"><option value="9" selected>Дымовой · h ≤ 3,5 м (до 9 м)</option><option value="8.5">Дымовой · 3,5–6 м (до 8,5 м)</option><option value="8">Дымовой · 6–10 м (до 8 м)</option><option value="7.5">Дымовой · 10–12 м (до 7,5 м)</option><option value="5">Тепловой · h ≤ 3,5 м (до 5 м)</option><option value="4.5">Тепловой · 3,5–6 м (до 4,5 м)</option><option value="4">Тепловой · 6–9 м (до 4 м)</option></select></div><div class="res" id="deRes"></div></div>'
 +'<div class="calc" id="c-rs"><h3>🧵 Сопротивление проводов линии</h3><div class="sub">Петля «туда-обратно» · предел сверяйте с паспортом прибора</div><div class="frow"><div class="fld"><label>Длина линии, м</label><input type="number" id="rsL" value="300"></div><div class="fld"><label>Сечение, мм²</label><select id="rsS"><option>0.5</option><option selected>0.75</option><option>1</option><option>1.5</option><option>2.5</option></select></div></div><div class="res" id="rsRes"></div></div>';
 calcAll();
}
function calcAll(){calcVD();calcHD();calcAKB();calcDET();calcRS();}
function calcVD(){var Lm=+$('#vdL').value||0,I=(+$('#vdI').value||0)/1000,S=+$('#vdS').value,U=+$('#vdU').value;
 var dU=0.0175*2*Lm*I/S,rem=U-dU,p=dU/U*100,v;
 if(p<=5){v=['v-ok','Отлично: укладывается в 5 %'];}else if(p<=10){v=['v-md','На границе — проверьте паспорт устройства'];}else{v=['v-bad','Много: увеличивайте сечение или сокращайте линию'];}
 $('#vdRes').innerHTML='<div class="big">ΔU = '+dU.toFixed(2)+' В</div><div class="row"><span>на устройстве</span><b>'+rem.toFixed(2)+' В из '+U+' В</b></div><div class="row"><span>в процентах</span><b>'+p.toFixed(1)+' %</b></div><div class="verdict '+v[0]+'">'+v[1]+'</div>';}
function calcHD(){var Nn=+$('#hdN').value||0,B=+$('#hdB').value||0,D=+$('#hdD').value||0;
 var gb=Nn*B*3600*24*D/8/1024,tb=gb/1024,rec=tb;
 var opts=[4,6,8,10,12,16,20];
 for(var i=0;i<opts.length;i++){if(opts[i]>=tb){rec=opts[i];break;}}
 if(tb>20)rec=Math.ceil(tb);
 $('#hdRes').innerHTML='<div class="big">'+(tb>=1?tb.toFixed(2)+' ТБ':Math.round(gb)+' ГБ')+'</div><div class="row"><span>суммарный поток</span><b>'+(Nn*B).toFixed(1)+' Мбит/с</b></div><div class="verdict v-ok">Ближайший накопитель — '+rec+' ТБ (surveillance-серия)</div>';}
function calcAKB(){var Pw=+$('#akP').value||0,t=+$('#akT').value||0,U=+$('#akU').value;
 var C=Pw*t/(U*0.8)*1.25,std=[7,12,17,26,40,65,100],rec=Math.ceil(C);
 for(var i=0;i<std.length;i++){if(std[i]>=C){rec=std[i];break;}}
 $('#akRes').innerHTML='<div class="big">≈ '+Math.ceil(C)+' А·ч</div><div class="row"><span>энергия за время автономии</span><b>'+(Pw*t).toFixed(0)+' Вт·ч</b></div><div class="verdict v-ok">Ближайший стандартный АКБ — '+rec+' А·ч</div>';}
function calcDET(){var Lm=+$('#deL').value||0,Wm=+$('#deW').value||0,a=+$('#deT').value;
 var nx=Math.max(1,Math.ceil(Lm/a)),ny=Math.max(1,Math.ceil(Wm/a)),n=nx*ny;
 $('#deRes').innerHTML='<div class="big">'+n+' шт</div><div class="row"><span>сетка</span><b>'+nx+' × '+ny+' (шаг до '+a+' м)</b></div><div class="row"><span>при алгоритме В (×2)</span><b>'+(n*2)+' шт</b></div><div class="verdict v-md">От стен — не более '+(a/2)+' м; финальная раскладка — по плану</div>';}
function calcRS(){var Lm=+$('#rsL').value||0,S=+$('#rsS').value,R=0.0175*2*Lm/S,v;
 if(R<30){v=['v-ok','Низкое сопротивление — ок для большинства приборов'];}else if(R<60){v=['v-md','Приемлемо, но сверьте лимит в паспорте ПКП'];}else{v=['v-bad','Высокое: берите большее сечение'];}
 $('#rsRes').innerHTML='<div class="big">'+R.toFixed(1)+' Ом</div><div class="row"><span>одна жила</span><b>'+(R/2).toFixed(1)+' Ом</b></div><div class="verdict '+v[0]+'">'+v[1]+'</div>';}
function renderInfo(){
 var h='<h2 class="sec">Избранное</h2><div class="card" id="infofavs"></div>';
 h+='<h2 class="sec">Кабели слаботочных систем</h2>';
 h+=card('info:cables','Марки и назначение',T(['Марка','Назначение','Примечание'],CABLES));
 h+=card('info:resist','Сопротивление медных жил, Ом/км',T(['Сечение, мм²','Жила','Петля (2 жилы)'],RESIST)+N('ρ меди ≈ 0,0175 Ом·мм²/м. Для ДПЛС и шлейфов считайте петлю и падение питания — калькулятор в «Расчёте».'));
 h+='<h2 class="sec">Нормативная база</h2>';
 h+=card('info:norms','Основные документы',T(['Документ','О чём'],NORMS)+W('Перед проектированием проверяйте актуальную редакцию и изменения.'));
 h+='<h2 class="sec">Глоссарий</h2>';
 h+=card('info:gloss','Термины','<dl class="gloss">'+GLOSS.map(function(g){return '<dt>'+g[0]+'</dt><dd>'+g[1]+'</dd>';}).join('')+'</dl>');
 h+='<h2 class="sec">О приложении</h2>';
 h+=card('info:about','Слаботочка PRO v1.2','<p>Офлайн-справочник для проектировщиков и монтажников слаботочных систем. Работает без сети.</p>'+P('Числовые значения приведены по действующим редакциям СП/ГОСТ для ориентира. В проекте сверяйтесь с актуальной редакцией документа и паспортами оборудования.'));
 $('#scr-info').innerHTML=h;
 renderFavViews();refreshFavBtns($('#scr-info'));
}
function renderFavViews(){
 var keys=Object.keys(FAVS);
 var html='';
 if(!keys.length){html='<div class="empty">Отмечайте карточки сердечком — они соберутся здесь.</div>';}
 keys.forEach(function(f){var m=FAVMETA[f];if(!m)return;
  html+='<div class="favitem" data-goto="'+m.fid+'"><span class="dot" style="background:'+m.color+'"></span><span class="t">'+m.title+'</span><button class="rm" data-rm="'+m.fid+'">✕</button></div>';});
 var h=$('#homefavs'),i=$('#infofavs');
 if(h)h.innerHTML=html;if(i)i.innerHTML=html;
 var fc=$('#favcount');fc.textContent=keys.length;fc.style.display=keys.length?'flex':'none';
}

/* ===== индекс поиска ===== */
function buildIndex(){
 INDEX=[];
 SYSTEMS.forEach(function(s){s.tabs.forEach(function(t){
  t.cards.forEach(function(c,j){
   var fid=s.id+':'+t.id+':'+j;
   var d=document.createElement('div');
   d.innerHTML=card(fid,c[0],c[1]);
   var el=d.querySelector('.card');
   var text=(c[0]+' '+c[1]).replace(/<[^>]*>/g,' ').replace(/\s+/g,' ');
   INDEX.push({fid:fid,title:c[0],text:text,tag:s.tag+' · '+t.label,color:s.color});
   FAVMETA[fid]={fid:fid,title:c[0],tag:s.tag,color:s.color};
  });
 });});
 SCHEMES.forEach(function(sc){
  var s=sysById(sc.sys);
  var text=(sc.title+' '+sc.cap).replace(/\s+/g,' ');
  INDEX.push({fid:sc.id,title:sc.title,text:text,tag:s.tag+' · схема',color:s.color});
  FAVMETA[sc.id]={fid:sc.id,title:sc.title,tag:'Схема',color:s.color};
 });
 var refs=[['info:cables','Кабели слаботочных систем',CABLES],['info:resist','Сопротивление медных жил',RESIST],['info:norms','Нормативные документы',NORMS],['info:gloss','Глоссарий слаботочника',GLOSS]];
 refs.forEach(function(r){
  var txt=r[2].map(function(x){return x.join(' ');}).join(' ');
  INDEX.push({fid:r[0],title:r[1],text:txt,tag:'Справочное',color:'#6f8bff'});
  FAVMETA[r[0]]={fid:r[0],title:r[1],tag:'Справочное',color:'#6f8bff'};
 });
}
function openSearch(){$('#searchov').classList.add('on');setTimeout(function(){$('#sinput').focus();},80);}
function closeSearch(){$('#searchov').classList.remove('on');$('#sinput').value='';$('#sres').innerHTML='<div class="empty" style="padding:14px">Введите запрос — поиск по всем разделам, схемам и нормам.</div>';}
function runSearch(q){
 q=q.trim().toLowerCase();var box=$('#sres');
 if(q.length<2){box.innerHTML='<div class="empty" style="padding:14px">Минимум 2 символа.</div>';return;}
 lastResults=INDEX.filter(function(it){return (it.title+' '+it.text).toLowerCase().indexOf(q)>=0;}).slice(0,30);
 if(!lastResults.length){box.innerHTML='<div class="empty" style="padding:14px">Ничего не найдено. Попробуйте: «датчик», «FRLS», «PoE», «СП 484».</div>';return;}
 box.innerHTML=lastResults.map(function(r,i){
  var idx=r.text.toLowerCase().indexOf(q);
  var snip=idx>=0?'…'+r.text.slice(Math.max(0,idx-40),idx+q.length+70)+'…':r.text.slice(0,90)+'…';
  try{snip=snip.replace(new RegExp(escReg(q),'gi'),function(m){return '<mark>'+m+'</mark>';});}catch(e){}
  return '<div class="sitem" data-i="'+i+'"><span class="tag" style="color:'+r.color+'">'+r.tag+'</span><b>'+r.title+'</b><span>'+snip+'</span></div>';
 }).join('');
}
function gotoFav(fid){
 if(fid.indexOf('sch-')===0){showScreen('schemes');setTimeout(function(){focus(fid);},80);return;}
 if(fid.indexOf('info:')===0){showScreen('info');setTimeout(function(){focus(fid);},80);return;}
 var parts=fid.split(':');
 renderDetail(parts[0]);showScreen('detail');
 setTimeout(function(){
  var btn=document.querySelector('#scr-detail .tab[data-tab="'+parts[1]+'"]');
  if(btn)btn.click();
  setTimeout(function(){focus(fid);},60);
 },80);
}
function focus(fid){var el=document.querySelector('[data-fid="'+fid+'"]');if(!el)return;el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');}

/* ===== навигация ===== */
function showScreen(name){
 $$('.screen').forEach(function(s){s.classList.remove('on');});
 $('#scr-'+name).classList.add('on');
 $$('.nbtn').forEach(function(b){b.classList.toggle('on',b.dataset.scr===name||(name==='detail'&&b.dataset.scr==='systems'));});
 $('#main').scrollTop=0;
}
function showDetail(id){renderDetail(id);showScreen('detail');}
function goCalc(cid){showScreen('calc');setTimeout(function(){var el=$('#c-'+cid);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},80);}

/* ===== избранное ===== */
function toggleFav(fid){
 if(FAVS[fid]){delete FAVS[fid];toast('Удалено из избранного');}
 else{FAVS[fid]=1;toast('Добавлено в избранное ♥');}
 saveFavs();refreshFavBtns(document);renderFavViews();
}
function refreshFavBtns(root){
 Array.prototype.forEach.call(root.querySelectorAll('.favbtn'),function(b){b.classList.toggle('on',!!FAVS[b.dataset.fid]);});
}

/* ===== делегированные события: одна точка привязки ===== */
document.addEventListener('click',function(e){
 var t=e.target,el;
 el=t.closest?t.closest('.favbtn'):null;
 if(el){toggleFav(el.dataset.fid);return;}
 el=t.closest?t.closest('.favitem .rm'):null;
 if(el){toggleFav(el.dataset.rm);return;}
 el=t.closest?t.closest('.favitem'):null;
 if(el){gotoFav(el.dataset.goto);return;}
 el=t.closest?t.closest('[data-go-sys]'):null;
 if(el){showDetail(el.dataset.goSys);return;}
 el=t.closest?t.closest('.nbtn'):null;
 if(el){showScreen(el.dataset.scr);return;}
 el=t.closest?t.closest('[data-qact]'):null;
 if(el){var v=el.dataset.qact;if(v==='schemes'){showScreen('schemes');}else{var pp=v.split(':');goCalc(pp[1]);}return;}
 el=t.closest?t.closest('[data-act]'):null;
 if(el){var a=el.dataset.act;
  if(a==='search')openSearch();
  else if(a==='search-close')closeSearch();
  else if(a==='favs'){showScreen('info');setTimeout(function(){var f=$('#infofavs');if(f)f.scrollIntoView({behavior:'smooth'});},80);}
  else if(a==='back'){showScreen('systems');}
  return;}
 el=t.closest?t.closest('#scr-detail .tab'):null;
 if(el){
  $$('#scr-detail .tab').forEach(function(x){x.classList.toggle('on',x===el);});
  $$('#scr-detail .tpanel').forEach(function(p){p.classList.toggle('on',p.dataset.panel===el.dataset.tab);});
  $('#main').scrollTop=0;
  return;}
 el=t.closest?t.closest('#schf .qchip'):null;
 if(el){
  $$('#schf .qchip').forEach(function(x){x.classList.remove('on');});
  el.classList.add('on');
  var f=el.dataset.f;
  $$('#schlist .scheme').forEach(function(c){
   var sc=null;
   for(var i=0;i<SCHEMES.length;i++){if(SCHEMES[i].id===c.dataset.fid){sc=SCHEMES[i];break;}}
   if(sc)c.style.display=(f==='all'||sc.sys===f)?'':'none';
  });
  return;}
 el=t.closest?t.closest('#hdP button'):null;
 if(el){$('#hdB').value=el.dataset.b;calcHD();return;}
 el=t.closest?t.closest('.sitem'):null;
 if(el){var r=lastResults[+el.dataset.i];closeSearch();if(r)gotoFav(r.fid);return;}
 if(t.id==='searchov')closeSearch();
});
document.addEventListener('input',function(e){
 if(e.target&&e.target.closest&&e.target.closest('#scr-calc')){calcAll();}
});
$('#sinput').addEventListener('input',function(e){runSearch(e.target.value);});

/* ===== роутер хэшей (шорткаты PWA) ===== */
var ROUTES=['home','systems','schemes','calc','info'];
function applyRoute(){var r=location.hash.replace('#','');if(ROUTES.indexOf(r)>=0)showScreen(r);}
window.addEventListener('hashchange',applyRoute);

function tickClock(){var d=new Date();$('#clock').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}

/* ===== запуск с проверками ===== */
function boot(){
 try{
  renderHome();renderSystems();renderSchemes();renderCalc();renderInfo();buildIndex();
  refreshFavBtns(document);
  var bm=document.getElementById('bootmsg');
  if(bm&&bm.parentNode)bm.parentNode.removeChild(bm);
  if(SYSTEMS.length!==8)fatal('Данные: ожидалось 8 систем, загружено '+SYSTEMS.length);
 }catch(err){fatal('boot: '+(err&&err.message?err.message:String(err)));}
 tickClock();setInterval(tickClock,10000);
 applyRoute();
}
boot();
})();
</script>
